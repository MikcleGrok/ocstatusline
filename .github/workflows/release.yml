name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CI_JOB_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build every target, run the gates, write the manifest
        run: make release

      - name: The linux-x64 binary must report exactly this tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          got="$(./build/ocstatusline-linux-x64 --version)"
          echo "binary reports: ${got}"
          echo "tag is:         ${GITHUB_REF_NAME}"
          test "$got" = "$GITHUB_REF_NAME"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            build/ocstatusline-* build/SHA256SUMS

      - name: Collect container logs
        if: always()
        run: make ci-logs > containers.log 2>&1 || true

      - name: Tear the stack down
        if: always()
        run: make ci-down || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ github.run_id }}
          path: containers.log
          if-no-files-found: warn