services:
  builder:
    container_name: ocstatusline-builder-${CI_JOB_ID}
    # Named volumes are created root:root, so the builder runs as root to
    # write into /out. CI is ephemeral; the local override keeps the
    # HOST_UID:GID user + ./build:/out bind-mount for the developer.
    user: "0:0"
    networks:
      - common
    volumes:
      - out:/out
      - node_modules:/src/node_modules
      - bun_cache:/bun-cache
    restart: "no"

  test-runner:
    container_name: ocstatusline-test-runner-${CI_JOB_ID}
    networks:
      - common
    volumes:
      - out:/out
      - node_modules:/src/node_modules
      - bun_cache:/bun-cache
    restart: "no"

  mock-opencode:
    container_name: ocstatusline-mock-opencode-${CI_JOB_ID}
    networks:
      - common
    volumes:
      - node_modules:/src/node_modules
      - bun_cache:/bun-cache
    restart: "no"

  smoke:
    container_name: ocstatusline-smoke-${CI_JOB_ID}
    networks:
      - common
    volumes:
      - out:/out:ro
      - ./tests/smoke:/smoke:ro
    restart: "no"

networks:
  common:
    name: ocstatusline-${CI_JOB_ID}

volumes:
  out:
    name: ocstatusline-out-${CI_JOB_ID}
  node_modules:
    name: ocstatusline-node-modules-${CI_JOB_ID}
  bun_cache:
    name: ocstatusline-bun-cache-${CI_JOB_ID}